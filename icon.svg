<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!--
    Znak ANNA OS — wariacja na logo SSI: heksagon, siatka neuronowa, linia zycia (EKG).
    Zastapil czerwony krzyz, ktory jest emblematem chronionym konwencjami genewskimi
    (w PL uzycie bez uprawnienia jest karalne). Kolor czerwony jako barwa jest wolny,
    chroniony jest ksztalt krzyza — dlatego akcent tu jest cyjanowy, zgodny z SSI.
  -->
  <defs>
    <linearGradient id="tlo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101828"/>
      <stop offset="1" stop-color="#070b14"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="192" height="192" rx="30" fill="url(#tlo)"/>

  <!-- siatka neuronowa: kilka polaczen w tle -->
  <g stroke="#2e5880" stroke-width="1.4" opacity="0.85">
    <line x1="72" y1="66" x2="120" y2="74"/>
    <line x1="72" y1="66" x2="80" y2="120"/>
    <line x1="120" y1="74" x2="118" y2="120"/>
    <line x1="80" y1="120" x2="118" y2="120"/>
    <line x1="118" y1="120" x2="132" y2="96"/>
  </g>

  <!-- heksagon (flat-top) -->
  <polygon points="154,96 125,146.2 67,146.2 38,96 67,45.8 125,45.8"
           fill="none" stroke="#4a74a8" stroke-width="4" stroke-linejoin="round"/>

  <!-- linia zycia -->
  <g filter="url(#glow)">
    <polyline points="44,96 69,96 76,99.6 82,96 89,104.4 96,66 103,111 110,96 120,87 129,96 148,96"
              fill="none" stroke="#28c8eb" stroke-width="5"
              stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <polyline points="44,96 69,96 76,99.6 82,96 89,104.4 96,66 103,111 110,96 120,87 129,96 148,96"
            fill="none" stroke="#dcfcff" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wezly: kilka cyjanowych, dwa gorace z rdzeniem -->
  <g fill="#2aa9d4">
    <circle cx="72" cy="66" r="3.2"/>
    <circle cx="80" cy="120" r="3.2"/>
    <circle cx="132" cy="96" r="3.2"/>
  </g>
  <g fill="#28c8eb" filter="url(#glow)">
    <circle cx="120" cy="74" r="4.2"/>
    <circle cx="118" cy="120" r="4.2"/>
  </g>
  <g fill="#dcfcff">
    <circle cx="120" cy="74" r="1.8"/>
    <circle cx="118" cy="120" r="1.8"/>
  </g>
</svg>
